version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pln_postgres
    restart: "no" # Manual start, tidak otomatis hidup saat booting/docker daemon start
    environment:
      POSTGRES_DB: pln_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
